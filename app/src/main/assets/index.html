<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naturlife</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f1;
    color: #183b20;
}

.header {
    background: #2e7d32;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 32px;
}

.header p {
    margin: 8px 0 0;
}

.container {
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 10px #00000015;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #2e7d32;
    color: white;
    font-size: 17px;
    margin-top: 10px;
}

input, select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    margin-bottom: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

h2 {
    margin-top: 0;
}
</style>
</head>

<body>

<div class="header">
    <h1>🌱 Naturlife</h1>
    <p>Smart Agriculture Guide</p>
</div>

<div class="container">

<div class="card">
    <h2>🌿 Select Your Crop</h2>

    <select id="crop">
        <option value="">Select any crop</option>
        <option>Rice</option>
        <option>Chilli</option>
        <option>Tomato</option>
        <option>Ginger</option>
        <option>Onion</option>
        <option>Carrot</option>
        <option>Cabbage</option>
        <option>Brinjal</option>
        <option>Watermelon</option>
        <option>Microgreens</option>
        <option>Other Crop</option>
    </select>
</div>

<div class="card">
    <h2>📍 Farm Location</h2>

    <input id="location"
           placeholder="Enter your farm location">

    <button onclick="getLocation()">
        📍 Use My Location
    </button>
</div>

<div class="card">
    <h2>📅 Planting Date</h2>

    <input type="date" id="plantingDate">

    <button onclick="createPlan()">
        🌱 Create Crop Plan
    </button>
</div>

<div class="card" id="result" style="display:none;">
    <h2>📋 Your Crop Plan</h2>
    <p id="planText"></p>
</div>

</div>

<script>

function getLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(function(position) {

            document.getElementById("location").value =
                "Location detected ✓";

        }, function() {

            alert("Please enter your location manually.");

        });

    } else {

        alert("Location service is not available.");

    }
}

function createPlan() {

    let crop = document.getElementById("crop").value;
    let location = document.getElementById("location").value;
    let date = document.getElementById("plantingDate").value;

    if (!crop || !date) {
        alert("Please select a crop and planting date.");
        return;
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("planText").innerHTML =
        "<b>Crop:</b> " + crop +
        "<br><b>Location:</b> " + (location || "Not added") +
        "<br><b>Planting Date:</b> " + date +
        "<br><br>🌱 Your Naturlife cultivation plan will be prepared.";
}

</script>

</body>
</html>
